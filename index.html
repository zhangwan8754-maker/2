<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10151c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="考研日课">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>考研日课</title>
<style>
:root { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
</style>
<style id="app-style">
/* Layout: one-screen phone app. Timer face on top, task list scrolling beneath, two-tab bar at the foot. */
:root {
  --bg: #f2f4f7;
  --surface: #ffffff;
  --ink: #1a2740;
  --muted: #64728a;
  --line: #dce2ea;
  --accent: #1e4f8f;
  --accent-soft: #e2ebf7;
  --on-accent: #ffffff;
  --red: #c5362c;
  --red-soft: #fae8e5;
  --on-red: #ffffff;
  --scrim: rgba(16, 24, 40, 0.45);
  --h1: #d9e6f5; --h1-fg: #1a2740;
  --h2: #b0cbea; --h2-fg: #1a2740;
  --h3: #7ba6d9; --h3-fg: #0f1c30;
  --h4: #4379bd; --h4-fg: #ffffff;
  --h5: #1e4f8f; --h5-fg: #ffffff;
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Noto Sans SC", "Microsoft YaHei", "WenQuanYi Zen Hei", sans-serif;
  --num: "DIN Alternate", "Bahnschrift", "Roboto Condensed", "Helvetica Neue", Arial, sans-serif;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10151c; --surface: #18202a; --ink: #e6ecf3; --muted: #8c9aad; --line: #2a3542;
    --accent: #7fb0ee; --accent-soft: #1c2c42; --on-accent: #0d1520;
    --red: #f0776b; --red-soft: #3a1f1d; --on-red: #1c0b09;
    --scrim: rgba(0, 0, 0, 0.6);
    --h1: #203552; --h1-fg: #e6ecf3;
    --h2: #27487a; --h2-fg: #e6ecf3;
    --h3: #2c5a99; --h3-fg: #ffffff;
    --h4: #4a82cc; --h4-fg: #ffffff;
    --h5: #86b6f2; --h5-fg: #0d1520;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10151c; --surface: #18202a; --ink: #e6ecf3; --muted: #8c9aad; --line: #2a3542;
  --accent: #7fb0ee; --accent-soft: #1c2c42; --on-accent: #0d1520;
  --red: #f0776b; --red-soft: #3a1f1d; --on-red: #1c0b09;
  --scrim: rgba(0, 0, 0, 0.6);
  --h1: #203552; --h1-fg: #e6ecf3;
  --h2: #27487a; --h2-fg: #e6ecf3;
  --h3: #2c5a99; --h3-fg: #ffffff;
  --h4: #4a82cc; --h4-fg: #ffffff;
  --h5: #86b6f2; --h5-fg: #0d1520;
  color-scheme: dark;
}

html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}
button, input, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
ul { list-style: none; margin: 0; padding: 0; }
p, h1, h2 { margin: 0; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; }

.app { height: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; }
.view {
  flex: 1; min-height: 0; overflow-y: auto;
  display: grid; align-content: start; gap: 16px;
  padding-block: 20px 28px;
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
}

/* Bottom tabs */
.tabs {
  display: flex; border-top: 1px solid var(--line);
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
}
.tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 9px 0 7px; font-size: 12px; color: var(--muted);
}
.tab[aria-current="page"] { color: var(--accent); font-weight: 600; }

/* Timer face */
.hero { display: grid; gap: 2px; }
.hero-date { font-size: 14px; color: var(--muted); }
.hero-label { font-size: 14px; color: var(--muted); margin-top: 10px; }
.hero-time {
  font-size: clamp(56px, 19vw, 84px); line-height: 1.05; font-weight: 700;
  letter-spacing: 0.01em; color: var(--ink);
}
.hero.is-running .hero-time { color: var(--red); }
.now {
  margin-top: 10px; display: flex; align-items: center; gap: 10px;
  background: var(--red-soft); border-radius: 12px; padding: 8px 8px 8px 14px;
}
.now-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); flex: none; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.25; } }
@media (prefers-reduced-motion: reduce) { .now-dot { animation: none; } }
.now-title { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 15px; }
.now-time { font-size: 17px; font-weight: 700; color: var(--red); }
.now-stop {
  background: var(--red); color: var(--on-red); border-radius: 9px;
  padding: 8px 16px; font-size: 15px; font-weight: 600; flex: none;
}
.notice { font-size: 13px; color: var(--red); background: var(--red-soft); border-radius: 10px; padding: 8px 12px; }

/* Add form */
.add { display: flex; gap: 8px; }
.add input {
  flex: 1; min-width: 0; height: 48px; padding: 0 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
}
.add input::placeholder { color: var(--muted); }
.add input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.add button {
  width: 48px; height: 48px; flex: none; border-radius: 12px;
  background: var(--accent); color: var(--on-accent);
  display: grid; place-items: center;
}

/* Rows shared by task list and day detail */
.rows { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.rows > li { display: flex; align-items: center; min-height: 56px; }
.rows > li + li { border-top: 1px solid var(--line); }
.row-main {
  flex: 1; min-width: 0; align-self: stretch; text-align: left;
  display: flex; align-items: center; gap: 10px; padding: 10px 0;
}
.row-title { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.row-time { flex: none; font-size: 15px; color: var(--muted); }

.check { width: 52px; height: 52px; flex: none; display: grid; place-items: center; }
.check-box {
  width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--muted);
  display: grid; place-items: center; color: transparent;
}
.task.done .check-box { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.task.done .row-title { color: var(--muted); text-decoration: line-through; }
.task.done .row-main { padding-right: 16px; }
.play { width: 56px; height: 52px; flex: none; display: grid; place-items: center; }
.play-btn {
  width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
  border: 1.5px solid var(--accent); color: var(--accent);
}
.task.running { background: var(--red-soft); }
.task.running .play-btn { background: var(--red); border-color: var(--red); color: var(--on-red); }
.task.running .row-time { color: var(--red); font-weight: 700; }

.empty { color: var(--muted); font-size: 15px; display: grid; gap: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 16px; font-size: 15px; color: var(--ink); }
.recent { display: flex; align-items: center; gap: 8px; overflow-x: auto; margin-top: -6px; scrollbar-width: none; }
.recent::-webkit-scrollbar { display: none; }
.recent-label { flex: none; font-size: 13px; color: var(--muted); }
.recent .chip { flex: none; white-space: nowrap; padding: 6px 14px; font-size: 14px; }

/* Calendar */
.cal-head { display: flex; align-items: center; gap: 4px; }
.cal-title { flex: 1; font-size: 22px; font-weight: 700; }
.cal-nav { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 10px; color: var(--ink); }
.cal-today { font-size: 14px; color: var(--accent); padding: 8px 10px; }
.cal-sum { font-size: 14px; color: var(--muted); margin-top: -10px; }
.cal-sum b { color: var(--ink); font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.wd { text-align: center; font-size: 12px; color: var(--muted); padding-bottom: 2px; }
.day {
  min-height: 50px; border-radius: 10px; background: var(--surface); color: var(--ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  border: 1.5px solid transparent;
}
.day-n { font-size: 15px; line-height: 1.2; }
.day-t { font-size: 11px; line-height: 1.2; min-height: 13px; }
.day.h1 { background: var(--h1); color: var(--h1-fg); }
.day.h2 { background: var(--h2); color: var(--h2-fg); }
.day.h3 { background: var(--h3); color: var(--h3-fg); }
.day.h4 { background: var(--h4); color: var(--h4-fg); }
.day.h5 { background: var(--h5); color: var(--h5-fg); }
.day.is-today .day-n { font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.day.is-sel { border-color: var(--ink); }
.day:disabled { background: transparent; color: var(--muted); opacity: 0.55; cursor: default; }
.legend { display: flex; align-items: center; justify-content: flex-end; gap: 6px; font-size: 12px; color: var(--muted); margin-top: -8px; }
.legend i { width: 14px; height: 14px; border-radius: 4px; display: block; }
.detail-head { display: flex; align-items: baseline; gap: 10px; }
.detail-head h2 { font-size: 17px; font-weight: 700; flex: 1; }
.detail-head span { font-size: 15px; color: var(--muted); }
.detail .row-main { padding-left: 16px; padding-right: 16px; }
.badge { flex: none; font-size: 12px; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 2px 7px; }
.link { font-size: 14px; color: var(--accent); justify-self: start; padding: 8px 0; text-decoration: underline; text-underline-offset: 3px; }

/* Bottom sheet */
.sheet { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: var(--scrim); }
.sheet-panel {
  width: 100%; max-width: 480px; max-height: 92%; overflow-y: auto;
  background: var(--surface); border-radius: 18px 18px 0 0;
  display: grid; gap: 14px;
  padding-top: 20px; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
}
.sheet-panel h2 { font-size: 18px; }
.field { display: grid; gap: 6px; }
.field label, .hint { font-size: 14px; color: var(--muted); }
.field input, .field textarea {
  width: 100%; padding: 11px 12px; background: var(--bg);
  border: 1px solid var(--line); border-radius: 10px;
}
.field textarea { height: 120px; resize: none; font-size: 12px; font-family: ui-monospace, Menlo, Consolas, monospace; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { flex: 1 1 120px; height: 46px; border-radius: 11px; font-weight: 600; border: 1px solid var(--line); background: var(--bg); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.danger { color: var(--red); }
.btn.danger.armed { background: var(--red); border-color: var(--red); color: var(--on-red); }
.status { font-size: 14px; color: var(--accent); min-height: 21px; }
</style>
</head>
<body>
<div class="app">
  <main class="view" id="view-today">
    <section class="hero" id="hero" aria-live="off"></section>
    <p class="notice" id="notice" hidden>当前浏览器不允许保存数据，关闭页面后记录会丢失。请换用普通浏览模式。</p>
    <form class="add" id="add-form" autocomplete="off">
      <input id="add-input" type="text" maxlength="60" enterkeyhint="done" placeholder="添加今天要学的内容" aria-label="添加今天要学的内容">
      <button type="submit" aria-label="添加任务">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </button>
    </form>
    <div class="recent" id="recent" hidden></div>
    <div id="task-list"></div>
  </main>

  <main class="view" id="view-cal" hidden></main>

  <nav class="tabs" aria-label="页面切换">
    <button class="tab" id="tab-today" data-act="tab" data-view="today" aria-current="page">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 7l2 2 3.5-4M4 16l2 2 3.5-4M13 7h7M13 16h7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      今日
    </button>
    <button class="tab" id="tab-cal" data-act="tab" data-view="cal">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4.5 6.5h15v13h-15zM4.5 10.5h15M8.5 4v4M15.5 4v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      日历
    </button>
  </nav>
</div>

<div class="sheet" id="sheet" hidden></div>

<script>
(function () {
  'use strict';

  var KEY = 'kaoyan-rike-v1';
  var WEEK = ['日', '一', '二', '三', '四', '五', '六'];
  var HEAT_HOURS = [2, 4, 6, 8];
  var ICON = {
    play: '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M8.5 5.5v13l10.5-6.5z" fill="currentColor"/></svg>',
    pause: '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M7 5h3.6v14H7zM13.4 5H17v14h-3.6z" fill="currentColor"/></svg>',
    check: '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    prev: '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    next: '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  };

  var $ = function (id) { return document.getElementById(id); };
  var storageOK = true;
  var state = load();
  var view = 'today';
  var lastDay = today();
  var cal = { y: new Date().getFullYear(), m: new Date().getMonth(), sel: lastDay };
  var sheet = null;
  var ticks = 0;

  /* ---------- dates and formatting ---------- */
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function dstr(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function today() { return dstr(new Date()); }
  function parseD(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function dayLabel(s) { var d = parseD(s); return (d.getMonth() + 1) + '月' + d.getDate() + '日 周' + WEEK[d.getDay()]; }
  function fmtClock(sec) {
    sec = Math.max(0, Math.floor(sec));
    var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    return h + ':' + pad(m) + ':' + pad(s);
  }
  function fmtShort(sec) {
    sec = Math.max(0, Math.floor(sec));
    var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    return h ? h + ':' + pad(m) + ':' + pad(s) : pad(m) + ':' + pad(s);
  }
  function fmtDur(sec) {
    if (sec <= 0) return '0分';
    var min = Math.max(1, Math.round(sec / 60));
    var h = Math.floor(min / 60), m = min % 60;
    return h ? h + '小时' + (m ? m + '分' : '') : m + '分';
  }
  function fmtCell(sec) {
    if (sec < 30) return '';
    return sec >= 3600 ? (sec / 3600).toFixed(1) + 'h' : Math.max(1, Math.round(sec / 60)) + 'm';
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ---------- state ---------- */
  function normalize(raw) {
    var out = { tasks: [], running: null };
    if (!raw || !Array.isArray(raw.tasks)) return out;
    raw.tasks.forEach(function (t) {
      if (!t || typeof t.title !== 'string' || !t.id) return;
      var log = {};
      if (t.log && typeof t.log === 'object') {
        Object.keys(t.log).forEach(function (k) {
          var v = +t.log[k];
          if (/^\d{4}-\d{2}-\d{2}$/.test(k) && v > 0) log[k] = v;
        });
      }
      out.tasks.push({
        id: String(t.id), title: t.title.slice(0, 60),
        date: /^\d{4}-\d{2}-\d{2}$/.test(t.date) ? t.date : today(),
        done: !!t.done, doneDate: t.done && t.doneDate ? t.doneDate : null, log: log
      });
    });
    var r = raw.running;
    if (r && typeof r.start === 'number' && out.tasks.some(function (t) { return t.id === String(r.id); })) {
      out.running = { id: String(r.id), start: r.start };
    }
    return out;
  }
  function load() {
    try { return normalize(JSON.parse(localStorage.getItem(KEY) || 'null')); }
    catch (e) { storageOK = false; return normalize(null); }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); storageOK = true; }
    catch (e) { storageOK = false; }
    $('notice').hidden = storageOK;
  }
  function byId(id) {
    for (var i = 0; i < state.tasks.length; i++) if (state.tasks[i].id === id) return state.tasks[i];
    return null;
  }
  /* Walk a time span day by day so a session crossing midnight lands on both days. */
  function eachDay(a, b, fn) {
    var cur = a;
    while (cur < b) {
      var d = new Date(cur);
      var next = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1).getTime();
      var end = Math.min(b, next);
      fn(dstr(d), (end - cur) / 1000);
      cur = end;
    }
  }
  function runningOn(id) { return state.running && state.running.id === id; }
  function secondsOn(task, date, now) {
    var sec = task.log[date] || 0;
    if (runningOn(task.id)) eachDay(state.running.start, now, function (k, s) { if (k === date) sec += s; });
    return sec;
  }
  function totals(now) {
    var map = {};
    state.tasks.forEach(function (t) {
      Object.keys(t.log).forEach(function (k) { map[k] = (map[k] || 0) + t.log[k]; });
    });
    if (state.running) eachDay(state.running.start, now, function (k, s) { map[k] = (map[k] || 0) + s; });
    return map;
  }
  /* Unfinished tasks from earlier days move to today. */
  function rollover() {
    var t = today(), changed = false;
    state.tasks.forEach(function (task) {
      if (!task.done && task.date < t) { task.date = t; changed = true; }
    });
    lastDay = t;
    return changed;
  }
  function stopTimer() {
    var r = state.running;
    if (!r) return;
    var task = byId(r.id);
    if (task) eachDay(r.start, Date.now(), function (k, s) { task.log[k] = Math.round((task.log[k] || 0) + s); });
    state.running = null;
  }

  /* ---------- today view ---------- */
  function renderHero() {
    var now = Date.now(), t = today();
    var total = totals(now)[t] || 0;
    var task = state.running && byId(state.running.id);
    var html = '<p class="hero-date">' + dayLabel(t) + '</p>' +
      '<p class="hero-label">今日已学</p>' +
      '<p class="hero-time num" id="total">' + fmtClock(total) + '</p>';
    if (task) {
      html += '<div class="now"><span class="now-dot"></span>' +
        '<span class="now-title">' + esc(task.title) + '</span>' +
        '<span class="now-time num" id="session">' + fmtShort((now - state.running.start) / 1000) + '</span>' +
        '<button class="now-stop" data-act="stop">停止</button></div>';
    }
    $('hero').className = 'hero' + (task ? ' is-running' : '');
    $('hero').innerHTML = html;
  }
  /* Titles finished on earlier days in the last two weeks and not on today's list: most repeated first, then most recent. */
  function recentTitles() {
    var t = today(), cutoff = dstr(new Date(Date.now() - 14 * 86400000));
    var onToday = {}, map = {};
    state.tasks.forEach(function (task) {
      if (task.date === t) { onToday[task.title] = true; return; }
      if (task.date < cutoff) return;
      var m = map[task.title] || (map[task.title] = { title: task.title, count: 0, last: '' });
      m.count++;
      if (task.date > m.last) m.last = task.date;
    });
    return Object.keys(map).filter(function (k) { return !onToday[k]; }).map(function (k) { return map[k]; })
      .sort(function (a, b) { return b.count - a.count || (a.last < b.last ? 1 : a.last > b.last ? -1 : 0); })
      .slice(0, 6);
  }
  function renderTasks() {
    var now = Date.now(), t = today();
    var list = state.tasks.filter(function (x) { return x.date === t; });
    var recent = recentTitles();
    $('recent').hidden = !recent.length;
    $('recent').innerHTML = recent.length ? '<span class="recent-label">最近</span>' + recent.map(function (r) {
      return '<button class="chip" data-act="recent" data-text="' + esc(r.title) + '">' + esc(r.title) + '</button>';
    }).join('') : '';
    if (!list.length) {
      $('task-list').innerHTML = '<div class="empty"><p>今天还没有任务。写下要学的内容，点右边的三角开始计时，学完打勾。</p>' +
        (recent.length ? '' : '<div class="chips">' + ['数学', '英语', '政治', '专业课'].map(function (s) {
          return '<button class="chip" data-act="chip" data-text="' + s + '">' + s + '</button>';
        }).join('') + '</div>') + '</div>';
      return;
    }
    list = list.filter(function (x) { return !x.done; }).concat(list.filter(function (x) { return x.done; }));
    $('task-list').innerHTML = '<ul class="rows">' + list.map(function (task) {
      var run = runningOn(task.id), sec = secondsOn(task, t, now);
      var time = run ? fmtShort(sec) : (sec >= 30 ? fmtDur(sec) : '');
      return '<li class="task' + (task.done ? ' done' : '') + (run ? ' running' : '') + '" data-id="' + esc(task.id) + '">' +
        '<button class="check" data-act="toggle" aria-pressed="' + task.done + '" aria-label="' + (task.done ? '取消完成' : '标记完成') + '"><span class="check-box">' + ICON.check + '</span></button>' +
        '<button class="row-main" data-act="edit" data-date="' + t + '"><span class="row-title">' + esc(task.title) + '</span>' +
        '<span class="row-time num"' + (run ? ' id="run-time"' : '') + '>' + time + '</span></button>' +
        (task.done ? '' : '<button class="play" data-act="timer" aria-label="' + (run ? '暂停计时' : '开始计时') + '"><span class="play-btn">' + (run ? ICON.pause : ICON.play) + '</span></button>') +
        '</li>';
    }).join('') + '</ul>';
  }

  /* ---------- calendar view ---------- */
  function heat(sec) {
    if (sec < 30) return 0;
    var h = sec / 3600, lvl = 1;
    HEAT_HOURS.forEach(function (x) { if (h >= x) lvl++; });
    return lvl;
  }
  function renderCal() {
    var now = Date.now(), t = today(), map = totals(now);
    var first = new Date(cal.y, cal.m, 1);
    var days = new Date(cal.y, cal.m + 1, 0).getDate();
    var lead = (first.getDay() + 6) % 7;
    var monthSec = 0, studied = 0, cells = '';
    var nowD = new Date(), isCurMonth = nowD.getFullYear() === cal.y && nowD.getMonth() === cal.m;
    for (var i = 0; i < lead; i++) cells += '<span></span>';
    for (var d = 1; d <= days; d++) {
      var k = cal.y + '-' + pad(cal.m + 1) + '-' + pad(d), sec = map[k] || 0, lvl = heat(sec);
      if (lvl) { monthSec += sec; studied++; }
      cells += '<button class="day' + (lvl ? ' h' + lvl : '') + (k === t ? ' is-today' : '') + (k === cal.sel ? ' is-sel' : '') + '"' +
        (k > t ? ' disabled' : '') + ' data-act="day" data-date="' + k + '" aria-label="' + (cal.m + 1) + '月' + d + '日，' + fmtDur(sec) + '">' +
        '<span class="day-n num">' + d + '</span><span class="day-t num">' + fmtCell(sec) + '</span></button>';
    }
    var html = '<div class="cal-head"><h1 class="cal-title">' + cal.y + '年' + (cal.m + 1) + '月</h1>' +
      (isCurMonth ? '' : '<button class="cal-today" data-act="cal-today">回到本月</button>') +
      '<button class="cal-nav" data-act="cal-prev" aria-label="上个月">' + ICON.prev + '</button>' +
      '<button class="cal-nav" data-act="cal-next" aria-label="下个月">' + ICON.next + '</button></div>' +
      '<p class="cal-sum">本月共学 <b>' + (monthSec / 3600).toFixed(1) + ' 小时</b>，有记录 <b>' + studied + ' 天</b></p>' +
      '<div class="grid">' + ['一', '二', '三', '四', '五', '六', '日'].map(function (w) { return '<span class="wd">' + w + '</span>'; }).join('') + cells + '</div>' +
      '<div class="legend"><span>少</span><i style="background:var(--h1)"></i><i style="background:var(--h2)"></i><i style="background:var(--h3)"></i><i style="background:var(--h4)"></i><i style="background:var(--h5)"></i><span>8 小时以上</span></div>';

    var sel = cal.sel;
    var items = state.tasks.map(function (task) {
      return { task: task, sec: secondsOn(task, sel, now), done: task.done && task.doneDate === sel };
    }).filter(function (x) { return x.sec >= 1 || x.done; });
    html += '<section class="detail" style="display:grid;gap:10px"><div class="detail-head"><h2>' + dayLabel(sel) + '</h2><span>共 ' + fmtDur(map[sel] || 0) + '</span></div>';
    if (items.length) {
      html += '<ul class="rows">' + items.map(function (x) {
        return '<li data-id="' + esc(x.task.id) + '"><button class="row-main" data-act="edit" data-date="' + sel + '">' +
          '<span class="row-title">' + esc(x.task.title) + '</span>' +
          (x.done ? '<span class="badge">已完成</span>' : '') +
          '<span class="row-time num">' + fmtDur(x.sec) + '</span></button></li>';
      }).join('') + '</ul>';
    } else {
      html += '<p class="empty">这天没有学习记录。</p>';
    }
    html += '</section><button class="link" data-act="backup">备份与恢复数据</button>';
    $('view-cal').innerHTML = html;
  }

  /* ---------- sheets ---------- */
  function openTaskSheet(id, date) {
    var task = byId(id);
    if (!task) return;
    var min = Math.round(secondsOn(task, date, Date.now()) / 60);
    sheet = { type: 'task', id: id, date: date, min: min };
    $('sheet').innerHTML = '<form class="sheet-panel" id="sheet-form" role="dialog" aria-modal="true" aria-labelledby="sheet-h">' +
      '<h2 id="sheet-h">修改任务</h2>' +
      '<div class="field"><label for="sheet-title">内容</label><input id="sheet-title" type="text" maxlength="60" value="' + esc(task.title) + '"></div>' +
      '<div class="field"><label for="sheet-min">' + dayLabel(date) + ' 学习时长（分钟）</label><input id="sheet-min" type="number" inputmode="numeric" min="0" max="1440" value="' + min + '"></div>' +
      '<div class="btns"><button class="btn primary" type="submit">保存</button><button class="btn" type="button" data-act="close">取消</button></div>' +
      '<div class="btns"><button class="btn danger" type="button" data-act="delete">删除任务</button></div>' +
      '<p class="hint">删除后，这条任务在所有日期的学习时长也会一起删除。</p></form>';
    $('sheet').hidden = false;
  }
  function openBackupSheet() {
    sheet = { type: 'backup' };
    $('sheet').innerHTML = '<div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-h">' +
      '<h2 id="sheet-h">备份与恢复</h2>' +
      '<p class="hint">记录只保存在这台手机的这个浏览器里。换手机或清理浏览器数据之前，先复制一份备份，存到备忘录或发给自己。</p>' +
      '<div class="field"><label for="backup-text">备份文本</label><textarea id="backup-text" spellcheck="false"></textarea></div>' +
      '<div class="btns"><button class="btn primary" type="button" data-act="copy">复制备份</button><button class="btn danger" type="button" data-act="restore">用框内文本恢复</button></div>' +
      '<p class="status" id="backup-status" role="status"></p>' +
      '<div class="btns"><button class="btn" type="button" data-act="close">关闭</button></div></div>';
    $('backup-text').value = JSON.stringify(state);
    $('sheet').hidden = false;
  }
  function closeSheet() { sheet = null; $('sheet').hidden = true; $('sheet').innerHTML = ''; }

  /* ---------- actions ---------- */
  function renderAll() {
    renderHero();
    renderTasks();
    if (view === 'cal') renderCal();
  }
  function commit() { save(); renderAll(); }

  function addTask(title) {
    title = title.trim().slice(0, 60);
    if (!title) return;
    state.tasks.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      title: title, date: today(), done: false, doneDate: null, log: {}
    });
    commit();
  }
  function shiftMonth(n) {
    var d = new Date(cal.y, cal.m + n, 1);
    cal.y = d.getFullYear(); cal.m = d.getMonth();
    renderCal();
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) {
      if (e.target === $('sheet')) closeSheet();
      return;
    }
    var act = el.getAttribute('data-act');
    var li = el.closest('[data-id]');
    var id = li && li.getAttribute('data-id');
    var task = id && byId(id);

    if (act === 'tab') {
      view = el.getAttribute('data-view');
      $('view-today').hidden = view !== 'today';
      $('view-cal').hidden = view !== 'cal';
      $('tab-today').toggleAttribute('aria-current', view === 'today');
      $('tab-cal').toggleAttribute('aria-current', view === 'cal');
      if (view === 'today') $('tab-today').setAttribute('aria-current', 'page');
      else $('tab-cal').setAttribute('aria-current', 'page');
      renderAll();
    } else if (act === 'recent') {
      addTask(el.getAttribute('data-text'));
    } else if (act === 'chip') {
      $('add-input').value = el.getAttribute('data-text') + ' ';
      $('add-input').focus();
    } else if (act === 'toggle' && task) {
      if (!task.done) {
        if (runningOn(task.id)) stopTimer();
        task.done = true; task.doneDate = today(); task.date = today();
      } else {
        task.done = false; task.doneDate = null;
      }
      commit();
    } else if (act === 'timer' && task) {
      var wasRunning = runningOn(task.id);
      stopTimer();
      if (!wasRunning) state.running = { id: task.id, start: Date.now() };
      commit();
    } else if (act === 'stop') {
      stopTimer(); commit();
    } else if (act === 'edit' && task) {
      openTaskSheet(task.id, el.getAttribute('data-date'));
    } else if (act === 'day') {
      cal.sel = el.getAttribute('data-date'); renderCal();
    } else if (act === 'cal-prev') {
      shiftMonth(-1);
    } else if (act === 'cal-next') {
      shiftMonth(1);
    } else if (act === 'cal-today') {
      var n = new Date(); cal.y = n.getFullYear(); cal.m = n.getMonth(); cal.sel = today(); renderCal();
    } else if (act === 'backup') {
      openBackupSheet();
    } else if (act === 'close') {
      closeSheet();
    } else if (act === 'delete' && sheet && sheet.type === 'task') {
      if (!el.classList.contains('armed')) {
        el.classList.add('armed'); el.textContent = '再点一次，确认删除';
        return;
      }
      if (runningOn(sheet.id)) state.running = null;
      state.tasks = state.tasks.filter(function (x) { return x.id !== sheet.id; });
      closeSheet(); commit();
    } else if (act === 'copy') {
      var ta = $('backup-text'), status = $('backup-status');
      var fallback = function () { ta.focus(); ta.select(); status.textContent = '已选中全部文本，请长按选择“复制”。'; };
      try {
        navigator.clipboard.writeText(ta.value).then(function () { status.textContent = '已复制。粘贴到备忘录里保存。'; }, fallback);
      } catch (err) { fallback(); }
    } else if (act === 'restore') {
      var st = $('backup-status'), parsed = null;
      try { parsed = JSON.parse($('backup-text').value); } catch (err) { parsed = null; }
      if (!parsed || !Array.isArray(parsed.tasks)) {
        st.textContent = '框内不是有效的备份文本。请把之前复制的备份完整粘贴进来。';
        return;
      }
      if (!el.classList.contains('armed')) {
        el.classList.add('armed'); el.textContent = '再点一次，覆盖现有记录';
        return;
      }
      state = normalize(parsed);
      rollover(); closeSheet(); commit();
    }
  });

  document.addEventListener('submit', function (e) {
    e.preventDefault();
    if (e.target.id === 'add-form') {
      addTask($('add-input').value);
      $('add-input').value = '';
    } else if (e.target.id === 'sheet-form' && sheet && sheet.type === 'task') {
      var task = byId(sheet.id);
      if (task) {
        var title = $('sheet-title').value.trim();
        if (title) task.title = title.slice(0, 60);
        var min = parseInt($('sheet-min').value, 10);
        if (!isNaN(min) && min >= 0 && min !== sheet.min) {
          if (runningOn(task.id)) stopTimer();
          min = Math.min(min, 1440);
          if (min === 0) delete task.log[sheet.date]; else task.log[sheet.date] = min * 60;
        }
      }
      closeSheet(); commit();
    }
  });

  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && sheet) closeSheet(); });

  /* ---------- clock ---------- */
  function tick() {
    if (today() !== lastDay) {
      if (rollover()) save();
      renderAll();
      return;
    }
    if (!state.running) return;
    var now = Date.now(), t = today(), task = byId(state.running.id);
    var total = $('total'), session = $('session'), row = $('run-time');
    if (total) total.textContent = fmtClock(totals(now)[t] || 0);
    if (session) session.textContent = fmtShort((now - state.running.start) / 1000);
    if (row && task) row.textContent = fmtShort(secondsOn(task, t, now));
    if (view === 'cal' && !sheet && ++ticks % 60 === 0) renderCal();
  }
  setInterval(tick, 1000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) tick(); });

  if (rollover()) save();
  $('notice').hidden = storageOK;
  renderAll();

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {}
  }
})();
</script>
</body>
</html>
