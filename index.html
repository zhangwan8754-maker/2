<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef1f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e131a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="考研日课">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>考研日课</title>
<style>
:root { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
</style>
<style id="app-style">
/* Layout: one-screen phone app. An ink-blue timer plate on top, white cards beneath, two-tab bar at the foot. */
:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --ink: #16233b;
  --muted: #66748b;
  --line: #e6eaf0;
  --edge: transparent;
  --shadow: 0 1px 2px rgba(22, 35, 59, 0.05), 0 8px 24px rgba(22, 35, 59, 0.07);
  --shadow-sm: 0 1px 2px rgba(22, 35, 59, 0.06), 0 2px 8px rgba(22, 35, 59, 0.05);
  --accent: #1e4f8f;
  --accent-soft: #e3ecf8;
  --on-accent: #ffffff;
  --red: #c5362c;
  --red-soft: #fbeae7;
  --on-red: #ffffff;
  --scrim: rgba(14, 22, 38, 0.48);
  --hero-bg: #1a3f74;
  --hero-fg: #ffffff;
  --hero-muted: rgba(255, 255, 255, 0.72);
  --hero-btn: #ffffff;
  --hero-btn-fg: #1a3f74;
  --hero-shadow: 0 10px 24px rgba(26, 63, 116, 0.22);
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Noto Sans SC", "Microsoft YaHei", "WenQuanYi Zen Hei", sans-serif;
  --num: "DIN Alternate", "Bahnschrift", "Roboto Condensed", sans-serif-condensed, "Helvetica Neue", Arial, sans-serif;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131a; --surface: #171f29; --ink: #e6ecf3; --muted: #8d9bae; --line: #263140;
    --edge: #263140; --shadow: none; --shadow-sm: none;
    --accent: #7fb0ee; --accent-soft: #1b2b41; --on-accent: #0d1520;
    --red: #f0776b; --red-soft: #3a1f1d; --on-red: #1c0b09;
    --scrim: rgba(0, 0, 0, 0.62);
    --hero-bg: #182f4f; --hero-fg: #eef3f9; --hero-muted: rgba(238, 243, 249, 0.68);
    --hero-btn: #e6ecf3; --hero-btn-fg: #0d1520; --hero-shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131a; --surface: #171f29; --ink: #e6ecf3; --muted: #8d9bae; --line: #263140;
  --edge: #263140; --shadow: none; --shadow-sm: none;
  --accent: #7fb0ee; --accent-soft: #1b2b41; --on-accent: #0d1520;
  --red: #f0776b; --red-soft: #3a1f1d; --on-red: #1c0b09;
  --scrim: rgba(0, 0, 0, 0.62);
  --hero-bg: #182f4f; --hero-fg: #eef3f9; --hero-muted: rgba(238, 243, 249, 0.68);
  --hero-btn: #e6ecf3; --hero-btn-fg: #0d1520; --hero-shadow: none;
  color-scheme: dark;
}

html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  -webkit-touch-callout: none;
  -webkit-user-select: none; user-select: none;
  touch-action: manipulation;
}
input, textarea { -webkit-user-select: text; user-select: text; }
button, input, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
ul { list-style: none; margin: 0; padding: 0; }
p, h1, h2 { margin: 0; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; }

.app { height: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; }
.view {
  flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none;
  display: grid; align-content: start; gap: 16px;
  padding-block: 16px 32px;
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
}
.view::-webkit-scrollbar { display: none; }

/* Press feedback */
.tab-ic, .play-btn, .check-box, .chip, .btn, .add button, .day, .cal-nav, .now-stop, .seg button {
  transition: transform 0.12s ease, background-color 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
}
.tab:active .tab-ic, .play:active .play-btn, .check:active .check-box, .chip:active, .btn:active,
.add button:active, .day:active, .cal-nav:active, .now-stop:active { transform: scale(0.93); }
.row-main:active .row-title { opacity: 0.6; }

/* Bottom tabs */
.tabs {
  display: flex; border-top: 1px solid var(--line);
  padding: 6px var(--gutter-r) 4px var(--gutter-l);
}
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 11px; color: var(--muted); }
.tab-ic { width: 60px; height: 30px; border-radius: 15px; display: grid; place-items: center; }
.tab[aria-current="page"] { color: var(--accent); font-weight: 600; }
.tab[aria-current="page"] .tab-ic { background: var(--accent-soft); }

/* Timer plate */
.hero { position: relative; border-radius: 22px; padding: 16px 20px 20px; color: var(--hero-fg); background: var(--hero-bg); box-shadow: var(--hero-shadow); }
.hero-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--hero-muted); }
.hero-time { font-size: clamp(60px, 20vw, 88px); line-height: 1; font-weight: 700; letter-spacing: 0.01em; margin-top: 10px; white-space: nowrap; }
.hero-sec { font-size: 0.5em; opacity: 0.72; margin-left: 0.04em; }
.now-stop { position: absolute; right: 16px; bottom: 18px; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--hero-btn); color: var(--hero-btn-fg); }
.notice { font-size: 13px; color: var(--red); background: var(--red-soft); border-radius: 12px; padding: 8px 12px; }

/* Add field */
.add {
  display: flex; align-items: center; gap: 6px; padding: 5px 5px 5px 16px;
  background: var(--surface); border: 1px solid var(--edge); border-radius: 16px; box-shadow: var(--shadow-sm);
  transition: box-shadow 0.18s ease;
}
.add:focus-within { box-shadow: 0 0 0 2px var(--accent); }
.add input { flex: 1; min-width: 0; height: 42px; padding: 0; border: 0; background: transparent; }
.add input:focus, .add input:focus-visible { outline: none; }
.add input::placeholder { color: var(--muted); }
.add button { width: 42px; height: 42px; flex: none; border-radius: 12px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }

/* Cards and rows */
.rows { background: var(--surface); border: 1px solid var(--edge); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
.rows > li { display: flex; align-items: center; min-height: 58px; background: var(--surface); }
.rows > li + li { border-top: 1px solid var(--line); }
.row-main { flex: 1; min-width: 0; align-self: stretch; text-align: left; display: flex; align-items: center; gap: 10px; padding: 10px 0; }
.row-title { flex: 1; min-width: 0; overflow-wrap: anywhere; transition: opacity 0.12s ease; }
.row-time { flex: none; font-size: 15px; color: var(--muted); }

.check { width: 54px; height: 54px; flex: none; display: grid; place-items: center; }
.check-box { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--muted); display: grid; place-items: center; color: transparent; }
.task.done .check-box { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.task.pop .check-box { animation: pop 0.38s cubic-bezier(0.3, 1.7, 0.5, 1); }
@keyframes pop { from { transform: scale(0.55); } }
.task.done .row-title { color: var(--muted); text-decoration: line-through; }
.task.done .row-main { padding-right: 18px; }
.play { width: 58px; height: 54px; flex: none; display: grid; place-items: center; }
.play-btn { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.rows > li.running { background: var(--red-soft); }
.task.running .play-btn { background: var(--red); color: var(--on-red); }
.task.running .row-time { color: var(--red); font-weight: 700; }

.empty { color: var(--muted); font-size: 15px; display: grid; gap: 12px; padding: 4px 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--edge); background: var(--surface); box-shadow: var(--shadow-sm); border-radius: 999px; padding: 7px 16px; font-size: 15px; color: var(--ink); }
.recent { display: flex; align-items: center; gap: 8px; overflow-x: auto; margin: -6px 0; padding: 4px 0; scrollbar-width: none; }
.recent::-webkit-scrollbar { display: none; }
.recent-label { flex: none; font-size: 13px; color: var(--muted); }
.recent .chip { flex: none; white-space: nowrap; padding: 6px 14px; font-size: 14px; }

/* Calendar */
.cal-head { display: flex; align-items: center; gap: 8px; padding-top: 4px; }
.cal-title { flex: 1; font-size: 24px; font-weight: 700; letter-spacing: 0.01em; }
.cal-nav { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; color: var(--ink); }
.cal-today { font-size: 14px; color: var(--accent); padding: 8px 6px; }
.card { background: var(--surface); border: 1px solid var(--edge); border-radius: 18px; box-shadow: var(--shadow); }
.cal-card { padding: 14px 10px 10px; }
.grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.wd { text-align: center; font-size: 12px; color: var(--muted); padding-bottom: 2px; }
.day {
  position: relative; min-height: 46px; border-radius: 12px; color: var(--ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
}
.day-n { font-size: 15px; line-height: 1.2; }
.day-t { font-size: 11px; line-height: 1.2; min-height: 13px; color: var(--accent); }
.day.on { background: var(--accent-soft); }
.day.is-today .day-n { font-weight: 700; color: var(--accent); }
.day.is-sel { background: var(--accent); }
.day.is-sel .day-n, .day.is-sel .day-t { color: var(--on-accent); }
.day:disabled { color: var(--muted); opacity: 0.5; cursor: default; }
.day.has-note::after { content: ""; position: absolute; top: 5px; right: 6px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.day.is-sel.has-note::after { background: var(--on-accent); }

.sec { display: grid; gap: 10px; }
.sec-head { display: flex; align-items: center; gap: 10px; min-height: 34px; }
.sec-head h2 { font-size: 17px; font-weight: 700; flex: 1; }
.sec-head span { font-size: 15px; color: var(--muted); }
.hint { font-size: 14px; color: var(--muted); }
.detail .row-main { padding-left: 18px; padding-right: 18px; }
.badge { flex: none; font-size: 12px; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 2px 7px; }
.note-wrap { display: grid; gap: 6px; }
.note {
  display: block; width: 100%; min-height: 80px; padding: 13px 16px; resize: none; line-height: 1.55;
  background: var(--surface); border: 1px solid var(--edge); border-radius: 16px; box-shadow: var(--shadow-sm);
  transition: box-shadow 0.18s ease;
}
.note::placeholder { color: var(--muted); }
.note:focus, .note:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent); }
.seg { display: flex; padding: 3px; border-radius: 11px; background: var(--line); }
.seg button { padding: 5px 14px; font-size: 14px; color: var(--muted); border-radius: 8px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: var(--shadow-sm); }
.sub-card { padding: 16px 18px 18px; display: grid; gap: 14px; }
.subs { display: grid; gap: 14px; }
.sub { display: grid; gap: 6px; }
.sub-line { display: flex; align-items: baseline; gap: 10px; }
.sub-name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.sub-val { flex: none; font-size: 14px; color: var(--muted); }
.sub-bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.sub-bar i { display: block; height: 100%; min-width: 4px; border-radius: 4px; background: var(--accent); transform-origin: left center; }
.subs.grow .sub-bar i { animation: grow 0.6s var(--ease) both; }
@keyframes grow { from { transform: scaleX(0); } }
.link { font-size: 14px; color: var(--accent); justify-self: start; padding: 8px 0; text-decoration: underline; text-underline-offset: 3px; }

/* Bottom sheet */
.sheet { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: var(--scrim); animation: fade-in 0.2s ease both; }
.sheet-panel {
  width: 100%; max-width: 480px; max-height: 92%; overflow-y: auto;
  background: var(--surface); border-radius: 24px 24px 0 0;
  display: grid; gap: 14px;
  padding-top: 10px; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  animation: rise 0.3s var(--ease) both;
}
.sheet-panel::before { content: ""; justify-self: center; width: 36px; height: 4px; border-radius: 2px; background: var(--line); }
.sheet.closing { animation: fade-out 0.18s ease both; }
.sheet.closing .sheet-panel { animation: sink 0.18s ease both; }
@keyframes fade-in { from { opacity: 0; } }
@keyframes fade-out { to { opacity: 0; } }
@keyframes rise { from { transform: translateY(100%); } }
@keyframes sink { to { transform: translateY(100%); } }
.sheet-panel h2 { font-size: 18px; }
.field { display: grid; gap: 6px; }
.field label { font-size: 14px; color: var(--muted); }
.field input, .field textarea { width: 100%; padding: 12px 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; }
.field textarea { height: 120px; resize: none; font-size: 12px; font-family: ui-monospace, Menlo, Consolas, monospace; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { flex: 1 1 120px; height: 48px; border-radius: 14px; font-weight: 600; background: var(--bg); }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.danger { color: var(--red); }
.btn.danger.armed { background: var(--red); color: var(--on-red); }
.status { font-size: 14px; color: var(--accent); min-height: 21px; }

/* Page transitions (browsers without view transitions just switch instantly) */
::view-transition { pointer-events: none; }
::view-transition-group(*) { animation-duration: 0.26s; animation-timing-function: var(--ease); }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: 0.18s; }
.grid { view-transition-name: cal-grid; }
:root[data-dir="next"]::view-transition-old(cal-grid) { animation: 0.24s var(--ease) both out-left; }
:root[data-dir="next"]::view-transition-new(cal-grid) { animation: 0.24s var(--ease) both in-right; }
:root[data-dir="prev"]::view-transition-old(cal-grid) { animation: 0.24s var(--ease) both out-right; }
:root[data-dir="prev"]::view-transition-new(cal-grid) { animation: 0.24s var(--ease) both in-left; }
@keyframes out-left { to { transform: translateX(-24%); opacity: 0; } }
@keyframes in-right { from { transform: translateX(24%); opacity: 0; } }
@keyframes out-right { to { transform: translateX(24%); opacity: 0; } }
@keyframes in-left { from { transform: translateX(-24%); opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>
<div class="app">
  <main class="view" id="view-today">
    <section class="hero" id="hero" aria-live="off"></section>
    <p class="notice" id="notice" hidden>当前浏览器不允许保存数据，关闭页面后记录会丢失。请换用普通浏览模式。</p>
    <form class="add" id="add-form" autocomplete="off">
      <input id="add-input" type="text" maxlength="60" enterkeyhint="done" placeholder="添加今天要学的内容" aria-label="添加今天要学的内容">
      <button type="submit" aria-label="添加任务">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </button>
    </form>
    <div class="recent" id="recent" hidden></div>
    <div id="task-list"></div>
  </main>

  <main class="view" id="view-cal" hidden></main>

  <nav class="tabs" aria-label="页面切换">
    <button class="tab" id="tab-today" data-act="tab" data-view="today" aria-current="page">
      <span class="tab-ic"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7l2 2 3.5-4M4 16l2 2 3.5-4M13 7h7M13 16h7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      今日
    </button>
    <button class="tab" id="tab-cal" data-act="tab" data-view="cal">
      <span class="tab-ic"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4.5 6.5h15v13h-15zM4.5 10.5h15M8.5 4v4M15.5 4v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      日历
    </button>
  </nav>
</div>

<div class="sheet" id="sheet" hidden></div>

<script>
(function () {
  'use strict';

  var KEY = 'kaoyan-rike-v1';
  var WEEK = ['日', '一', '二', '三', '四', '五', '六'];
  var ICON = {
    play: '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M8.5 5.5v13l10.5-6.5z" fill="currentColor"/></svg>',
    pause: '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M7 5h3.6v14H7zM13.4 5H17v14h-3.6z" fill="currentColor"/></svg>',
    stop: '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>',
    check: '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    prev: '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    next: '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  };

  var $ = function (id) { return document.getElementById(id); };
  var storageOK = true;
  var state = load();
  var view = 'today';
  var lastDay = today();
  var cal = { y: new Date().getFullYear(), m: new Date().getMonth(), sel: lastDay, range: 'week' };
  var sheet = null;
  var ticks = 0;
  var popId = null;      // task whose check mark should bounce on the next render
  var growBars = false;  // subject bars grow in on the next calendar render
  var REDUCED = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  var canVT = typeof document.startViewTransition === 'function' && !REDUCED;

  /* Run a DOM update inside a view transition where the browser has them; otherwise just run it. */
  function animate(fn, dir) {
    var ae = document.activeElement;
    var typing = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA');
    if (!canVT || typing) { fn(); return; }
    var root = document.documentElement, noop = function () {};
    if (dir) root.setAttribute('data-dir', dir); else root.removeAttribute('data-dir');
    try {
      var vt = document.startViewTransition(fn);
      vt.ready.catch(noop);
      vt.updateCallbackDone.catch(noop);
      vt.finished.catch(noop);
    } catch (e) { fn(); }
  }
  function buzz() { try { if (navigator.vibrate) navigator.vibrate(8); } catch (e) {} }

  /* ---------- dates and formatting ---------- */
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function dstr(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function today() { return dstr(new Date()); }
  function parseD(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function dayLabel(s) { var d = parseD(s); return (d.getMonth() + 1) + '月' + d.getDate() + '日 周' + WEEK[d.getDay()]; }
  function fmtClock(sec) {
    sec = Math.max(0, Math.floor(sec));
    var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    return h + ':' + pad(m) + ':' + pad(s);
  }
  function fmtShort(sec) {
    sec = Math.max(0, Math.floor(sec));
    var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    return h ? h + ':' + pad(m) + ':' + pad(s) : pad(m) + ':' + pad(s);
  }
  function fmtDur(sec) {
    if (sec <= 0) return '0分';
    var min = Math.max(1, Math.round(sec / 60));

  function fmtCell(sec) {

  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ---------- state ---------- */
  function normalize(raw) {
    var out = { tasks: [], running: null, notes: {} };
    if (!raw || !Array.isArray(raw.tasks)) return out;
    if (raw.notes && typeof raw.notes === 'object') {
      Object.keys(raw.notes).forEach(function (k) {
        var v = raw.notes[k];
        if (/^\d{4}-\d{2}-\d{2}$/.test(k) && typeof v === 'string' && v.trim()) out.notes[k] = v.trim().slice(0, 500);
      });
    }
    raw.tasks.forEach(function (t) {
      if (!t || typeof t.title !== 'string' || !t.id) return;
      var log = {};
      if (t.log && typeof t.log === 'object') {
        Object.keys(t.log).forEach(function (k) {
          var v = +t.log[k];
          if (/^\d{4}-\d{2}-\d{2}$/.test(k) && v > 0) log[k] = v;
        });
      }
      out.tasks.push({
        id: String(t.id), title: t.title.slice(0, 60),
        date: /^\d{4}-\d{2}-\d{2}$/.test(t.date) ? t.date : today(),
        done: !!t.done, doneDate: t.done && t.doneDate ? t.doneDate : null, log: log
      });
    });
    var r = raw.running;
    if (r && typeof r.start === 'number' && out.tasks.some(function (t) { return t.id === String(r.id); })) {
      out.running = { id: String(r.id), start: r.start };
    }
    return out;
  }
  function load() {
    try { return normalize(JSON.parse(localStorage.getItem(KEY) || 'null')); }
    catch (e) { storageOK = false; return normalize(null); }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); storageOK = true; }
    catch (e) { storageOK = false; }
    $('notice').hidden = storageOK;
  }
  function byId(id) {
    for (var i = 0; i < state.tasks.length; i++) if (state.tasks[i].id === id) return state.tasks[i];
    return null;
  }
  /* Walk a time span day by day so a session crossing midnight lands on both days. */
  function eachDay(a, b, fn) {
    var cur = a;
    while (cur < b) {
      var d = new Date(cur);
      var next = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1).getTime();
      var end = Math.min(b, next);
      fn(dstr(d), (end - cur) / 1000);
      cur = end;
    }
  }
  function runningOn(id) { return state.running && state.running.id === id; }
  function secondsOn(task, date, now) {
    var sec = task.log[date] || 0;
    if (runningOn(task.id)) eachDay(state.running.start, now, function (k, s) { if (k === date) sec += s; });
    return sec;
  }
  function totals(now) {
    var map = {};
    state.tasks.forEach(function (t) {
      Object.keys(t.log).forEach(function (k) { map[k] = (map[k] || 0) + t.log[k]; });
    });
    if (state.running) eachDay(state.running.start, now, function (k, s) { map[k] = (map[k] || 0) + s; });
    return map;
  }
  /* The subject is the first word of the title: "数学 高数第三章" counts as 数学. */
  function subjectOf(title) {
    var parts = title.split(/[\s　·•:：\-—_/，,、|]+/).filter(Boolean);
    var first = parts[0] || '';
    if (parts.length > 1) return first.slice(0, 8);
    return first && first.length <= 4 ? first : '其他';
  }
  /* Study time per subject between two dates (inclusive), largest first, at most five named subjects plus 其他. */
  function bySubject(from, to, now) {
    var map = {}, total = 0;
    var add = function (title, k, s) {
      if (k < from || k > to) return;
      var name = subjectOf(title);
      map[name] = (map[name] || 0) + s; total += s;
    };
    state.tasks.forEach(function (t) {
      Object.keys(t.log).forEach(function (k) { add(t.title, k, t.log[k]); });
    });
    var rt = state.running && byId(state.running.id);
    if (rt) eachDay(state.running.start, now, function (k, s) { add(rt.title, k, s); });
    var other = map['其他'] || 0;
    delete map['其他'];
    var list = Object.keys(map).map(function (n) { return { name: n, sec: map[n] }; })
      .sort(function (a, b) { return b.sec - a.sec; });
    list.slice(5).forEach(function (x) { other += x.sec; });
    list = list.slice(0, 5);
    if (other >= 1) list.push({ name: '其他', sec: other });
    return { list: list.filter(function (x) { return x.sec >= 1; }), total: total };
  }
  /* Unfinished tasks from earlier days move to today. */
  function rollover() {
    var t = today(), changed = false;
    state.tasks.forEach(function (task) {
      if (!task.done && task.date < t) { task.date = t; changed = true; }
    });
    lastDay = t;
    return changed;
  }
  function stopTimer() {
    var r = state.running;
    if (!r) return;
    var task = byId(r.id);
    if (task) eachDay(r.start, Date.now(), function (k, s) { task.log[k] = Math.round((task.log[k] || 0) + s); });
    state.running = null;
  }

  /* ---------- today view ---------- */
  function splitClock(sec) { var c = fmtClock(sec); return [c.slice(0, -3), c.slice(-3)]; }
  function renderHero() {
    var now = Date.now(), t = today();
    var c = splitClock(totals(now)[t] || 0);
    var task = state.running && byId(state.running.id);
    var html = '<div class="hero-top"><span>今日已学</span><span class="hero-date">' + dayLabel(t) + '</span></div>' +
      '<p class="hero-time num" id="total"><span id="total-hm">' + c[0] + '</span><span class="hero-sec" id="total-s">' + c[1] + '</span></p>' +
      (task ? '<button class="now-stop" data-act="stop" aria-label="停止计时">' + ICON.stop + '</button>' : '');
    $('hero').className = 'hero' + (task ? ' is-running' : '');
    $('hero').innerHTML = html;
  }
  /* Titles finished on earlier days in the last two weeks and not on today's list: most repeated first, then most recent. */
  function recentTitles() {
    var t = today(), cutoff = dstr(new Date(Date.now() - 14 * 86400000));
    var onToday = {}, map = {};
    state.tasks.forEach(function (task) {
      if (task.date === t) { onToday[task.title] = true; return; }
      if (task.date < cutoff) return;
      var m = map[task.title] || (map[task.title] = { title: task.title, count: 0, last: '' });
      m.count++;
      if (task.date > m.last) m.last = task.date;
    });
    return Object.keys(map).filter(function (k) { return !onToday[k]; }).map(function (k) { return map[k]; })
      .sort(function (a, b) { return b.count - a.count || (a.last < b.last ? 1 : a.last > b.last ? -1 : 0); })
      .slice(0, 6);
  }
  function renderTasks() {
    var now = Date.now(), t = today();
    var list = state.tasks.filter(function (x) { return x.date === t; });
    var recent = recentTitles();
    $('recent').hidden = !recent.length;
    $('recent').innerHTML = recent.length ? '<span class="recent-label">最近</span>' + recent.map(function (r) {
      return '<button class="chip" data-act="recent" data-text="' + esc(r.title) + '">' + esc(r.title) + '</button>';
    }).join('') : '';
    if (!list.length) {
      $('task-list').innerHTML = '<div class="empty"><p>今天还没有任务。写下要学的内容，点右边的三角开始计时，学完打勾。</p>' +
        (recent.length ? '' : '<div class="chips">' + ['数学', '英语', '政治', '专业课'].map(function (s) {
          return '<button class="chip" data-act="chip" data-text="' + s + '">' + s + '</button>';
        }).join('') + '</div>') + '</div>';
      return;
    }
    list = list.filter(function (x) { return !x.done; }).concat(list.filter(function (x) { return x.done; }));
    $('task-list').innerHTML = '<ul class="rows">' + list.map(function (task) {
      var run = runningOn(task.id), sec = secondsOn(task, t, now);
      var time = run ? fmtShort(sec) : (sec >= 30 ? fmtDur(sec) : '');
      return '<li class="task' + (task.done ? ' done' : '') + (run ? ' running' : '') + (task.id === popId ? ' pop' : '') + '" data-id="' + esc(task.id) +
        '" style="view-transition-name:t-' + task.id.replace(/[^A-Za-z0-9_-]/g, '') + '">' +
        '<button class="check" data-act="toggle" aria-pressed="' + task.done + '" aria-label="' + (task.done ? '取消完成' : '标记完成') + '"><span class="check-box">' + ICON.check + '</span></button>' +
        '<button class="row-main" data-act="edit" data-date="' + t + '"><span class="row-title">' + esc(task.title) + '</span>' +
        '<span class="row-time num"' + (run ? ' id="run-time"' : '') + '>' + time + '</span></button>' +
        (task.done ? '' : '<button class="play" data-act="timer" aria-label="' + (run ? '暂停计时' : '开始计时') + '"><span class="play-btn">' + (run ? ICON.pause : ICON.play) + '</span></button>') +
        '</li>';
    }).join('') + '</ul>';
    popId = null;
  }

  /* ---------- calendar view ---------- */
  function renderCal() {
    var now = Date.now(), t = today(), map = totals(now);
    var first = new Date(cal.y, cal.m, 1);
    var days = new Date(cal.y, cal.m + 1, 0).getDate();
    var lead = (first.getDay() + 6) % 7;
    var cells = '';
    var nowD = new Date(), isCurMonth = nowD.getFullYear() === cal.y && nowD.getMonth() === cal.m;
    for (var i = 0; i < lead; i++) cells += '<span></span>';
    for (var d = 1; d <= days; d++) {
      var k = cal.y + '-' + pad(cal.m + 1) + '-' + pad(d), sec = map[k] || 0;
      cells += '<button class="day' + (sec >= 30 ? ' on' : '') + (k === t ? ' is-today' : '') + (k === cal.sel ? ' is-sel' : '') + (state.notes[k] ? ' has-note' : '') + '"' +
        (k > t ? ' disabled' : '') + ' data-act="day" data-date="' + k + '" aria-label="' + (cal.m + 1) + '月' + d + '日，' + fmtDur(sec) + (state.notes[k] ? '，有复盘' : '') + '">' +
        '<span class="day-n num">' + d + '</span><span class="day-t num">' + fmtCell(sec) + '</span></button>';
    }
    var html = '<div class="cal-head"><h1 class="cal-title">' + cal.y + '年' + (cal.m + 1) + '月</h1>' +
      (isCurMonth ? '' : '<button class="cal-today" data-act="cal-today">回到本月</button>') +
      '<button class="cal-nav" data-act="cal-prev" aria-label="上个月">' + ICON.prev + '</button>' +
      '<button class="cal-nav" data-act="cal-next" aria-label="下个月">' + ICON.next + '</button></div>' +
      '<div class="card cal-card"><div class="grid">' + ['一', '二', '三', '四', '五', '六', '日'].map(function (w) { return '<span class="wd">' + w + '</span>'; }).join('') + cells + '</div></div>';

    var sel = cal.sel;
    var items = state.tasks.map(function (task) {
      return { task: task, sec: secondsOn(task, sel, now), done: task.done && task.doneDate === sel };
    }).filter(function (x) { return x.sec >= 1 || x.done; });
    html += '<section class="detail sec"><div class="sec-head"><h2>' + dayLabel(sel) + '</h2><span>共 ' + fmtDur(map[sel] || 0) + '</span></div>';
    if (items.length) {
      html += '<ul class="rows">' + items.map(function (x) {
        return '<li data-id="' + esc(x.task.id) + '"><button class="row-main" data-act="edit" data-date="' + sel + '">' +
          '<span class="row-title">' + esc(x.task.title) + '</span>' +
          (x.done ? '<span class="badge">已完成</span>' : '') +
          '<span class="row-time num">' + fmtDur(x.sec) + '</span></button></li>';
      }).join('') + '</ul>';
    } else {
      html += '<p class="empty">这天没有学习记录。</p>';
    }
    html += '<div class="note-wrap"><label class="hint" for="note">复盘</label>' +
      '<textarea class="note" id="note" maxlength="500" placeholder="今天卡在哪，明天先做什么">' + esc(state.notes[sel] || '') + '</textarea></div></section>';

    var from, to, rangeLabel;
    if (cal.range === 'week') {
      var sd = parseD(sel), mon = new Date(sd.getFullYear(), sd.getMonth(), sd.getDate() - (sd.getDay() + 6) % 7);
      var sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6);
      from = dstr(mon); to = dstr(sun);
      rangeLabel = (mon.getMonth() + 1) + '月' + mon.getDate() + '日 – ' + (sun.getMonth() + 1) + '月' + sun.getDate() + '日';
    } else {
      from = cal.y + '-' + pad(cal.m + 1) + '-01'; to = cal.y + '-' + pad(cal.m + 1) + '-' + pad(days);
      rangeLabel = cal.y + '年' + (cal.m + 1) + '月';
    }
    var subs = bySubject(from, to, now);
    html += '<section class="sec"><div class="sec-head"><h2>科目占比</h2><div class="seg" role="group" aria-label="统计范围">' +
      '<button data-act="range" data-range="week" aria-pressed="' + (cal.range === 'week') + '">按周</button>' +
      '<button data-act="range" data-range="month" aria-pressed="' + (cal.range === 'month') + '">按月</button></div></div>' +
      '<div class="card sub-card"><p class="hint">' + rangeLabel + '，共 ' + fmtDur(subs.total) + '</p>';
    if (subs.list.length) {
      html += '<div class="subs' + (growBars ? ' grow' : '') + '">' + subs.list.map(function (x) {
        var pct = subs.total ? x.sec / subs.total * 100 : 0;
        return '<div class="sub"><div class="sub-line"><span class="sub-name">' + esc(x.name) + '</span>' +
          '<span class="sub-val num">' + fmtDur(x.sec) + ' · ' + Math.round(pct) + '%</span></div>' +
          '<div class="sub-bar"><i style="width:' + pct.toFixed(1) + '%"></i></div></div>';
      }).join('') + '</div>';
    }
    html += '</div></section>' +
      '<button class="link" data-act="backup">备份与恢复数据</button>';
    $('view-cal').innerHTML = html;
    growBars = false;

  }

  function growNote() {
    var n = $('note');
    if (!n) return;
    n.style.height = 'auto';
    n.style.height = (n.scrollHeight + 2) + 'px';
  }

  /* ---------- sheets ---------- */
  function openTaskSheet(id, date) {
    var task = byId(id);
    if (!task) return;
    var min = Math.round(secondsOn(task, date, Date.now()) / 60);
    sheet = { type: 'task', id: id, date: date, min: min };
    $('sheet').innerHTML = '<form class="sheet-panel" id="sheet-form" role="dialog" aria-modal="true" aria-labelledby="sheet-h">' +
      '<h2 id="sheet-h">修改任务</h2>' +
      '<div class="field"><label for="sheet-title">内容</label><input id="sheet-title" type="text" maxlength="60" value="' + esc(task.title) + '"></div>' +
      '<div class="field"><label for="sheet-min">' + dayLabel(date) + ' 学习时长（分钟）</label><input id="sheet-min" type="number" inputmode="numeric" min="0" max="1440" value="' + min + '"></div>' +
      '<div class="btns"><button class="btn primary" type="submit">保存</button><button class="btn" type="button" data-act="close">取消</button></div>' +
      '<div class="btns"><button class="btn danger" type="button" data-act="delete">删除任务</button></div>' +
      '<p class="hint">删除后，这条任务在所有日期的学习时长也会一起删除。</p></form>';
    $('sheet').classList.remove('closing');
    $('sheet').hidden = false;
  }
  function openBackupSheet() {
    sheet = { type: 'backup' };

      '<h2 id="sheet-h">备份与恢复</h2>' +
      '<p class="hint">记录只保存在这台手机的这个浏览器里。换手机或清理浏览器数据之前，先复制一份备份，存到备忘录或发给自己。</p>' +
      '<div class="field"><label for="backup-text">备份文本</label><textarea id="backup-text" spellcheck="false"></textarea></div>' +
      '<div class="btns"><button class="btn primary" type="button" data-act="copy">复制备份</button><button class="btn danger" type="button" data-act="restore">用框内文本恢复</button></div>' +
      '<p class="status" id="backup-status" role="status"></p>' +
      '<div class="btns"><button class="btn" type="button" data-act="close">关闭</button></div></div>';

  function closeSheet() {
    if (!sheet) return;

    var el = $('sheet');
    var finish = function () {
      if (sheet) return;   // another sheet opened meanwhile
      el.hidden = true; el.innerHTML = ''; el.classList.remove('closing');
    };
    if (REDUCED) { finish(); return; }
    el.classList.add('closing');
    setTimeout(finish, 180);
  }

  /* ---------- actions ---------- */
  function renderAll() {
    renderHero();
    renderTasks();
    if (view === 'cal') renderCal();
  }
  function commit(dir) { save(); animate(renderAll, dir); }

  function addTask(title) {
    title = title.trim().slice(0, 60);
    if (!title) return;
    state.tasks.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      title: title, date: today(), done: false, doneDate: null, log: {}
    });
    commit();
  }
  function shiftMonth(n) {
    var d = new Date(cal.y, cal.m + n, 1);
    cal.y = d.getFullYear(); cal.m = d.getMonth();
    animate(renderCal, n > 0 ? 'next' : 'prev');
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) {
      if (e.target === $('sheet')) closeSheet();
      return;
    }
    var act = el.getAttribute('data-act');
    var li = el.closest('[data-id]');
    var id = li && li.getAttribute('data-id');
    var task = id && byId(id);

    if (act === 'tab') {
      var nv = el.getAttribute('data-view');
      if (nv === view) return;
      animate(function () {
        view = nv;
        growBars = view === 'cal';
        $('view-today').hidden = view !== 'today';
        $('view-cal').hidden = view !== 'cal';
        ['today', 'cal'].forEach(function (v) {

      });
    } else if (act === 'recent') {

    } else if (act === 'chip') {
      $('add-input').value = el.getAttribute('data-text') + ' ';
      $('add-input').focus();
    } else if (act === 'toggle' && task) {
      if (!task.done) {
        if (runningOn(task.id)) stopTimer();
        task.done = true; task.doneDate = today(); task.date = today();
        popId = task.id;
      } else {
        task.done = false; task.doneDate = null;
      }
      buzz(); commit();
    } else if (act === 'timer' && task) {
      var wasRunning = runningOn(task.id);
      stopTimer();
      if (!wasRunning) state.running = { id: task.id, start: Date.now() };
      buzz(); commit();
    } else if (act === 'stop') {
      stopTimer(); buzz(); commit();
    } else if (act === 'edit' && task) {
      openTaskSheet(task.id, el.getAttribute('data-date'));
    } else if (act === 'day') {
      cal.sel = el.getAttribute('data-date'); animate(renderCal);
    } else if (act === 'range') {
      cal.range = el.getAttribute('data-range'); growBars = true; animate(renderCal);
    } else if (act === 'cal-prev') {
      shiftMonth(-1);
    } else if (act === 'cal-next') {
      shiftMonth(1);
    } else if (act === 'cal-today') {
      var n = new Date(); cal.y = n.getFullYear(); cal.m = n.getMonth(); cal.sel = today(); animate(renderCal);
    } else if (act === 'backup') {
      openBackupSheet();
    } else if (act === 'close') {
      closeSheet();
    } else if (act === 'delete' && sheet && sheet.type === 'task') {
      if (!el.classList.contains('armed')) {
        el.classList.add('armed'); el.textContent = '再点一次，确认删除';
        return;
      }
      if (runningOn(sheet.id)) state.running = null;
      state.tasks = state.tasks.filter(function (x) { return x.id !== sheet.id; });
      closeSheet(); commit();
    } else if (act === 'copy') {
      var ta = $('backup-text'), status = $('backup-status');
      var fallback = function () { ta.focus(); ta.select(); status.textContent = '已选中全部文本，请长按选择“复制”。'; };
      try {
        navigator.clipboard.writeText(ta.value).then(function () { status.textContent = '已复制。粘贴到备忘录里保存。'; }, fallback);
      } catch (err) { fallback(); }
    } else if (act === 'restore') {
      var st = $('backup-status'), parsed = null;
      try { parsed = JSON.parse($('backup-text').value); } catch (err) { parsed = null; }
      if (!parsed || !Array.isArray(parsed.tasks)) {
        st.textContent = '框内不是有效的备份文本。请把之前复制的备份完整粘贴进来。';
        return;
      }
      if (!el.classList.contains('armed')) {
        el.classList.add('armed'); el.textContent = '再点一次，覆盖现有记录';
        return;
      }
      state = normalize(parsed);
      rollover(); closeSheet(); commit();
    }
  });

  document.addEventListener('submit', function (e) {
    e.preventDefault();
    if (e.target.id === 'add-form') {
      addTask($('add-input').value);
      $('add-input').value = '';
    } else if (e.target.id === 'sheet-form' && sheet && sheet.type === 'task') {
      var task = byId(sheet.id);
      if (task) {
        var title = $('sheet-title').value.trim();
        if (title) task.title = title.slice(0, 60);
        var min = parseInt($('sheet-min').value, 10);
        if (!isNaN(min) && min >= 0 && min !== sheet.min) {
          if (runningOn(task.id)) stopTimer();
          min = Math.min(min, 1440);
          if (min === 0) delete task.log[sheet.date]; else task.log[sheet.date] = min * 60;
        }
      }
      closeSheet(); commit();
    }
  });

  /* The day's note saves as it is typed; no re-render, so the cursor stays put. */
  document.addEventListener('input', function (e) {
    if (e.target.id !== 'note') return;
    var v = e.target.value.slice(0, 500);
    if (v.trim()) state.notes[cal.sel] = v; else delete state.notes[cal.sel];
    save();
    growNote();
    var cell = document.querySelector('.day.is-sel');
    if (cell) cell.classList.toggle('has-note', !!v.trim());
  });

  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && sheet) closeSheet(); });

  /* ---------- clock ---------- */
  function tick() {
    if (today() !== lastDay) {
      if (rollover()) save();
      renderAll();
      return;
    }
    if (!state.running) return;
    var now = Date.now(), t = today(), task = byId(state.running.id);
    var total = $('total'), row = $('run-time');
    if (total) {
      var c = splitClock(totals(now)[t] || 0);
      if ($('total-hm').textContent !== c[0]) $('total-hm').textContent = c[0];
      $('total-s').textContent = c[1];
    }
    if (row && task) row.textContent = fmtShort(secondsOn(task, t, now));
    var typing = document.activeElement && document.activeElement.id === 'note';
    if (view === 'cal' && !sheet && !typing && ++ticks % 60 === 0) renderCal();
  }
  setInterval(tick, 1000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) tick(); });

  if (rollover()) save();
  $('notice').hidden = storageOK;
  renderAll();

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {}
  }
})();
</script>
</body>
</html>
